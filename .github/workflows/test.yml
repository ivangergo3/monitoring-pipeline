name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/monitor.sh tests/*.sh
      - run: shellcheck scripts/monitor.sh tests/*.sh
      - run: bash tests/run.sh
      - run: bash scripts/monitor.sh matrix
